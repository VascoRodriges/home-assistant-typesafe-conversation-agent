name: release

# Run this by hand from the Actions tab once the version bump is on main:
# Actions -> release -> Run workflow -> enter the version.
#
# It deliberately does not bump manifest.json itself. Bumping it in the normal
# pull request keeps the version under review with the change that earned it,
# and means this workflow never has to push to a protected branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write # needed to create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release notes are generated from history

      - name: Check manifest.json already declares this version
        run: |
          MANIFEST=$(python -c "import json; print(json.load(open('custom_components/typesafe_conversation/manifest.json'))['version'])")
          if [ "$MANIFEST" != "${{ inputs.version }}" ]; then
            echo "::error::manifest.json says $MANIFEST, you asked to release ${{ inputs.version }}."
            echo "Bump manifest.json on main first - HACS reports the manifest version to users."
            exit 1
          fi
          echo "manifest.json and the requested version agree: $MANIFEST"

      - name: Check the tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes
