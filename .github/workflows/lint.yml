name: lint

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Pinned so CI and a contributor's laptop agree on what "clean" means.
      - run: pip install "ruff==0.16.9"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .
